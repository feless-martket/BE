version: "3"

services:
  app-blue:
    image: yoonhyojin1016/kurlykelly_server:latest
    container_name: blue
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=blue

    ports:
      - "8081:8080"
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: mysql-blue
    env_file:
      - .env
    volumes:
      - mysql-blue-data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-blue-data:
