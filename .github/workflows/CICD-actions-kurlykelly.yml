name: CICD

on:
  push:
    branches: ["release"]
  pull_request:
    branches: ["release"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # (1) 코드 체크아웃
      - uses: actions/checkout@v3

      # (2) JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      # (3) gradlew 실행 권한 부여
      - name: Run chmod to make gradlew executable
        run: chmod +x ./gradlew

      # (4) Spring Boot 빌드 (테스트 제외)
      - name: Spring Boot Build
        run: ./gradlew clean build -x test

      # (5) Docker Hub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PW }}

      - name: Print current directory and files
        run: |
          echo "Current directory: $GITHUB_WORKSPACE"
          ls -al

      # (6) Docker 이미지 빌드 (latest 태그 포함)
      - name: docker image build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/kurlykelly_server:latest .

      # (7) Docker 이미지 Push
      - name: docker Hub push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/kurlykelly_server:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # A) GitHub Actions Runner의 퍼블릭 IP 확인 → AWS 보안 그룹 인바운드 설정을 위해
      - name: get GitHub IP
        id: ip
        uses: haythem/public-ip@v1.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Add GitHub IP to AWS
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: List all files in workspace
        run: find . -maxdepth 2 | sort

      - name: List nginx folder
        run: ls -al docker/nginx/

      # C) Blue/Green 배포 스크립트
      - name: Blue-Green Deploy in one script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.KURLYKELLY_SERVER_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          port: 22
          script: |
            # 1) 현재 실행 중인 컨테이너 확인 (blue 또는 green)
            echo "Checking for current running container..."
            CURRENT_CONTAINER=$(docker ps --filter "name=blue\|green" --format "{{.Names}}")
            echo "현재 컨테이너: $CURRENT_CONTAINER"
            
            # 2) 새 배포 대상 결정 (Blue/Green 전환)
            if [ -z "$CURRENT_CONTAINER" ]; then
              echo "현재 실행 중인 컨테이너가 없습니다. Blue/Green 배포를 초기화합니다."
              TARGET="blue"
              TARGET_PORT="8081"
            else
              if [ "$CURRENT_CONTAINER" = "blue" ]; then
                TARGET="green"
                TARGET_PORT="8082"
              else
                TARGET="blue"
                TARGET_PORT="8081"
              fi
            fi
            echo "새 컨테이너 배포 대상: $TARGET, 포트: $TARGET_PORT"
            
            # (옵션) 필요 시, 네트워크가 없으면 생성
            docker network inspect my-bridge-network > /dev/null 2>&1 || docker network create my-bridge-network
            
            # 3) 최신 이미지 Pull
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kurlykelly_server:latest
            
            # 4) 기존 배포 대상 컨테이너 중지 및 삭제 (있다면)
            docker stop $TARGET || true
            docker rm $TARGET || true
            
            # 5) 새 컨테이너 실행 (Blue 또는 Green)
            docker run -d \
            --name $TARGET \
            --network my-bridge-network \
            -p ${TARGET_PORT}:${TARGET_PORT} \
            --env-file .env \
            -e SPRING_PROFILES_ACTIVE=$TARGET \
            -e SERVER_PORT=${TARGET_PORT} \
            ${{ secrets.DOCKERHUB_USERNAME }}/kurlykelly_server:latest
            
            
            # 6) 새 컨테이너 헬스체크 (최대 10회, 5초 간격)
            for i in {1..10}; do
              sleep 5
              HEALTH=$(curl -s "http://localhost:${TARGET_PORT}/actuator/health")
              echo "Health check response: $HEALTH"
              if echo "$HEALTH" | grep '"status":"UP"' > /dev/null; then
                echo "새 컨테이너 헬스체크 성공"
            
                # Nginx 프록시 포트 업데이트: sed 명령어를 이용해 nginx.conf 내 proxy_pass 변경
                sed -i "s/proxy_pass http:\/\/.*:[0-9]\+/proxy_pass http:\/\/3.34.181.33:${TARGET_PORT}/" ~/docker/nginx/nginx.conf
            
                # nginx 컨테이너 재시작 (docker-compose 없이 docker restart 사용)
                docker restart nginxserver
            
                echo "배포 완료"
                exit 0
              fi
            done
            
            echo "새 컨테이너 헬스체크 실패"
            docker logs $TARGET
            docker rm -f $TARGET
            exit 1

      - name: Remove GitHub IP from AWS Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
