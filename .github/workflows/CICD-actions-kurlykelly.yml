name: CICD

# master 브랜치에 push, PR 이벤트 발생시 동작
on:
  push:
    branches: ["release"]
  pull_request:
    branches: ["release"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # (1) 프로그램 빌드 (Java 빌드)
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      # 설정 파일 생성
      - name: Create application-secret.yml
        run: |
          echo "${{ secrets.APPLICATION_SECRET }}" > src/main/resources/application-secret.yml

      - name: Run chmod to make gradlew executable
        run: chmod +x ./gradlew

      - name: Spring Boot Build
        run: ./gradlew clean build -x test

      # Docker Hub에 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PW }}

      - name: Print current directory and files
        run: |
          echo "Current directory: $GITHUB_WORKSPACE"
          ls -al

      # Docker 이미지 빌드 및 Push
      - name: docker image build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/kurlykelly_server .

      - name: docker Hub push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/kurlykelly_server

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # A) GitHub Actions Runner의 퍼블릭 IP를 확인하여, AWS 보안 그룹에 22번 포트 열기
      - name: get GitHub IP
        id: ip
        uses: haythem/public-ip@v1.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Add GitHub IP to AWS
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      # B) **한 번의 SSH 액션** 안에서 Blue/Green 로직 처리
      - name: Blue-Green Deploy in one script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.KURLYKELLY_SERVER_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          password: ${{ secrets.EC2_PASSWORD }}
          port: 22
          script: |
            # 1) 현재 실행 중인 컨테이너 확인
             CURRENT_CONTAINER=$(docker ps --filter "name=app-*" --format "{{.Names}}")
             
             # 2) 새로운 배포 대상 결정
             if [ "$CURRENT_CONTAINER" == "app-blue" ]; then
               TARGET="green"
               TARGET_PORT="8081"
             else
               TARGET="blue"
               TARGET_PORT="8080"
             fi
             
             echo "Deploying to $TARGET environment..."
             
             # 3) 최신 이미지 pull
             docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kurlykelly_server:latest
             
             # 4) 새 컨테이너 실행
             docker-compose -f docker/$TARGET/docker-compose-$TARGET.yml up -d
             
             # 5) 헬스체크
             for i in {1..10}; do
               sleep 5
               if curl -s "http://localhost:$TARGET_PORT/actuator/health" | grep "UP"; then
                 echo "New container is healthy"
                 
                 # 6) Nginx 설정 업데이트
                 sed -i "s/proxy_pass http:\/\/localhost:[0-9]\+/proxy_pass http:\/\/localhost:$TARGET_PORT/" docker/nginx/nginx.conf
                 docker-compose -f docker/nginx/docker-compose-nginx.yml restart
                 
                 # 7) 이전 컨테이너 중지 및 제거
                 if [ ! -z "$CURRENT_CONTAINER" ]; then
                   docker stop $CURRENT_CONTAINER
                   docker rm $CURRENT_CONTAINER
                 fi
                 
                 echo "Deployment completed successfully"
                 exit 0
               fi
             done
             
             # 8) 배포 실패 시
             echo "New container health check failed"
             docker logs app-$TARGET
             docker-compose -f docker/$TARGET/docker-compose-$TARGET.yml down
             exit 1

      # GitHub Actions Runner IP를 AWS 보안 그룹에서 제거
      - name: Remove GitHub IP from AWS Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
