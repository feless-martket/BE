version: "3"
services:
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80" # 호스트의 80번 포트를 Nginx 80번과 매핑
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always

  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    restart: always
    networks:
      - app-network
