version: "3.8"

services:
  app:
    image: yoonhyojin1016/kurlykelly_server:latest
    #image: ${DOCKERHUB_USERNAME}/kurlykelly_server:latest
    container_name: green
    environment:
      - SPRING_PROFILES_ACTIVE=green
      - MYSQL_URL=${MYSQL_URL}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "8082:8082"
    restart: always
