spring:
  config:
    activate:
      on-profile: ${SPRING_PROFILES_ACTIVE:blue} # 기본은 dev (EC2 배포 시 blue 또는 green으로 설정)

  servlet:
    multipart:
      enabled: true # 멀티파트 파일 업로드 활성화*
      location: c:\upload # 개발(Windows) 기본 경로 – 배포 시 오버라이드됨*
      max-request-size: 300MB # 최대 요청 크기*
      max-file-size: 50MB # 최대 파일 크기*

  jpa:
    hibernate:
      ddl-auto: update # 개발 환경에서는 create, 프로덕션에서는 변경 필요*
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    generate-ddl: true

  jwt:
    secret: ${JWT_SECRET_KEY}

  data:
    redis:
      host: kurlykelly-cache-server.gaatel.ng.0001.apn2.cache.amazonaws.com
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000
        auth-code-expiration-millis: 1800000 *# 30분*

cloud:
  aws:
    credentials:
      access-key: ${your_access_key}
      secret-key: ${your_secret_key}
    region:
      static: ap-northeast-2
  s3:
    bucket: marketkurry-bucket
    stack:
      auto: false

server:
  port: 8080 # dev 환경 기본 포트

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: always
